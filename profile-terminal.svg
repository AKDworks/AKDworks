<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="292" role="img" aria-labelledby="title">
  <title id="title">akdworks --info</title>
  <style>
    .frame {
      width: calc(100% - 1px);
      height: 291px;
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      fill: #a5d6ff;
    }
    @media (max-width: 370px) {
      text { font-size: 11px; }
      .terminal-text { transform: translateX(-6px); }
    }
  </style>
  <defs>
    <clipPath id="rounded-panel">
      <rect class="frame" x=".5" y=".5" rx="6"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded-panel)">
    <rect width="100%" height="292" fill="#151b23"/>
    <rect width="100%" height="38" fill="#0d1117"/>
    <line x2="100%" y1="38.5" y2="38.5" stroke="#3d444d"/>
  </g>
  <rect class="frame" x=".5" y=".5" rx="6" fill="none" stroke="#3d444d"/>
  <g class="terminal-text">
    <text x="14" y="23">$ akdworks --info</text>
    <text x="14" y="65">akdworks@github</text>
    <text x="14" y="84">───────────────</text>
    <text x="14" y="103" xml:space="preserve">Role      Developer and Vibe Coder</text>
    <text x="14" y="121.5" xml:space="preserve">Focus     Websites &amp; apps</text>
    <text x="14" y="140" xml:space="preserve">Stack     Next.js · React</text>
    <text x="14" y="158.5" xml:space="preserve">          TypeScript · JavaScript</text>
    <text x="14" y="177" xml:space="preserve">Tools     Claude Code · Codex · VS Code</text>
    <text x="14" y="195.5" xml:space="preserve">OS        Windows</text>
    <text x="14" y="214" xml:space="preserve">Email     akdworks@yahoo.com</text>
    <text x="14" y="251" xml:space="preserve">Building  LockScore</text>
    <text x="14" y="269.5" xml:space="preserve">          Deadlock stats &amp; wiki</text>
  </g>
</svg>
